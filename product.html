<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>SIMPLE - Product</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
    <style>
        /* =========================
           PRODUCT GALLERY
           ========================= */
        .product-images {
            width: 100%;
        }
        .main-image-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 45px;
        }
        #main-product-image {
            width: 100%;
            max-width: 420px;
            max-height: 520px;
            display: block;
            object-fit: contain;
            margin: 0 auto;
        }
        /* =========================
           GALLERY ARROWS
           ========================= */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(
                255,
                255,
                255,
                0.3
            );
            background: rgba(
                0,
                0,
                0,
                0.65
            );
            color: white;
            font-size: 30px;
            line-height: 35px;
            cursor: pointer;
        }
        .gallery-prev {
            left: 10px;
        }
        .gallery-next {
            right: 10px;
        }
        /* =========================
           THUMBNAILS
           ========================= */
        .product-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
            padding: 5px 0 10px;
            justify-content: center;
        }
        .product-thumbnail {
            width: 75px;
            height: 75px;
            flex: 0 0 75px;
            object-fit: cover;
            border: 1px solid #444;
            cursor: pointer;
            opacity: 0.55;
            transition: 0.2s;
        }
        .product-thumbnail.active {
            opacity: 1;
            border-color: white;
        }
        /* =========================
           COLOR / SIZE BUTTONS
           ========================= */
        #colors,
        #sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .option-button {
            width: auto !important;
            min-width: 55px;
            padding: 10px 16px !important;
            margin: 0 !important;
            background: transparent !important;
            color: white !important;
            border: 1px solid #555 !important;
            cursor: pointer;
            font-size: 14px;
        }
        .option-button.active {
            background: white !important;
            color: #111 !important;
            border-color: white !important;
        }
        /* =========================
           MOBILE
           ========================= */
        @media (max-width: 768px) {
            .main-image-wrapper {
                padding: 10px 40px;
            }
            #main-product-image {
                max-width: 90%;
                max-height: 450px;
            }
            .gallery-arrow {
                width: 38px;
                height: 38px;
                font-size: 26px;
                line-height: 32px;
            }
            .gallery-prev {
                left: 5px;
            }
            .gallery-next {
                right: 5px;
            }
            .product-thumbnail {
                width: 65px;
                height: 65px;
                flex-basis: 65px;
            }
        }
    </style>
</head>
<body>
    <!-- =========================
         HEADER
         ========================= -->
    <header>
        <a
            href="index.html"
            class="logo"
        >
            <div class="logo-main">
                SIMPLE
            </div>
            <div class="logo-hieroglyph">
                𓋹𓅓𓊃𓏏𓃭
            </div>
        </a>
        <nav>
            <a href="index.html">
                Home
            </a>
            <a href="index.html#collection">
                Collection
            </a>
            <a href="index.html#contact">
                Contact
            </a>
        </nav>
        <div class="language">
            <button type="button">
                EN
            </button>
            <button type="button">
                AR
            </button>
        </div>
    </header>
    <!-- =========================
         PRODUCT PAGE
         ========================= -->
    <main>
        <section class="product-page">
            <!-- =========================
                 PRODUCT IMAGE GALLERY
                 ========================= -->
            <div class="product-images">
                <div class="main-image-wrapper">
                    <button
                        type="button"
                        class="gallery-arrow gallery-prev"
                        id="gallery-prev"
                    >
                        ‹
                    </button>
                    <img
                        id="main-product-image"
                        src=""
                        alt="Product"
                    >
                    <button
                        type="button"
                        class="gallery-arrow gallery-next"
                        id="gallery-next"
                    >
                        ›
                    </button>
                </div>
                <div
                    id="product-thumbnails"
                    class="product-thumbnails"
                ></div>
            </div>
            <!-- =========================
                 PRODUCT INFORMATION
                 ========================= -->
            <div class="product-info">
                <h1 id="product-name"></h1>
                <p id="product-price"></p>
                <!-- COLOR -->
                <div class="product-option">
                    <h3>
                        COLOR
                    </h3>
                    <div id="colors"></div>
                </div>
                <!-- SIZE -->
                <div class="product-option">
                    <h3>
                        SIZE
                    </h3>
                    <div id="sizes"></div>
                </div>
                <!-- QUANTITY -->
                <div class="product-option">
                    <h3>
                        QUANTITY
                    </h3>
                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        value="1"
                    >
                </div>
                <!-- =========================
                     CUSTOMER DETAILS
                     ========================= -->
                <div class="order-details">
                    <h2>
                        YOUR DETAILS
                    </h2>
                    <form
                        id="productOrderForm"
                    >
                        <input
                            type="text"
                            id="name"
                            placeholder="Full Name"
                            required
                        >
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Phone Number"
                            required
                        >
                        <input
                            type="text"
                            id="governorate"
                            placeholder="Governorate"
                            required
                        >
                        <textarea
                            id="address"
                            placeholder="Full Address"
                            required
                        ></textarea>
                        <button
                            type="submit"
                        >
                            SUBMIT ORDER
                        </button>
                    </form>
                    <p id="order-message"></p>
                </div>
            </div>
        </section>
    </main>
    <!-- =========================
         FOOTER
         ========================= -->
    <footer id="contact">
        <h2>
            SIMPLE
        </h2>
        <div class="footer-hieroglyph">
            𓋹𓅓𓊃𓏏𓃭
        </div>
        <p>
            Made with simplicity.
        </p>
    </footer>
    <!-- =========================
         JAVASCRIPT
         ========================= -->
    <script src="products.js"></script>
    <script src="product.js"></script>
</body>
</html>
