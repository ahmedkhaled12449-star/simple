<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            <div class="logo-main">SIMPLE</div>
            <div class="logo-hieroglyph">𓋹𓅓𓊃𓏏𓃭</div>
        </a>
        <nav>
            <a href="#home">Home</a>
            <a href="#collection">Collection</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="language">
            <button type="button">EN</button>
            <button type="button">AR</button>
        </div>
    </header>
    <main>
        <!-- HERO -->
        <section id="home" class="hero">
            <div class="hero-content">
                <p class="small-title">
                    SIMPLE COLLECTION
                </p>
                <h1>
                    Simple.<br>
                    But Different.
                </h1>
                <p class="hero-description">
                    Discover our latest collection.
                </p>
                <a href="#collection" class="shop-button">
                    SHOP COLLECTION
                </a>
            </div>
        </section>
        <!-- COLLECTION -->
        <section id="collection" class="collection">
            <div class="collection-heading">
                <p class="collection-small-title">
                    THE COLLECTION
                </p>
                <h2>
                    OUR COLLECTION
                </h2>
                <span class="collection-symbol">
                    𓂀
                </span>
            </div>
            <!-- Products are loaded from products.js -->
            <div id="products-container"></div>
        </section>
    </main>
    <!-- FOOTER -->
    <footer id="contact">
        <h2>SIMPLE</h2>
        <div class="footer-hieroglyph">
            𓋹𓅓𓊃𓏏𓃭
        </div>
        <p>
            Made with simplicity.
        </p>
    </footer>
    <!-- PRODUCT DATA -->
    <script src="products.js"></script>
    <!-- MAIN SCRIPT -->
    <script>
        const container =
            document.getElementById("products-container");
        products.forEach(product => {
            const card =
                document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div class="product-image-wrapper">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        class="product-image"
                    >
                </div>
                <div class="product-card-content">
                    <div class="product-symbol">
                        𓂀
                    </div>
                    <h3>
                        ${product.name}
                    </h3>
                    <p class="product-price">
                        ${product.price} EGP
                    </p>
                    <a
                        href="product.html?id=${product.id}"
                        class="product-order-button"
                    >
                        ORDER NOW
                    </a>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
